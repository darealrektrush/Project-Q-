services:
  - type: web
    name: project-q
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: TELEGRAM_ADMIN_USER_IDS
        sync: false
      - key: TELEGRAM_FOUNDER_USER_IDS
        sync: false
      - key: BAGWORK_SECRET
        sync: false
      - key: ORACLE_CAMPAIGN_SECRET
        sync: false
      - key: PROJECT_Q_CAMPAIGN_APP_URL
        sync: false
      - key: PROJECT_Q_CAMPAIGN_APP_ENABLED
        value: "false"
      - key: PROJECT_Q_WALLET_VERIFICATION_ENABLED
        value: "false"
      - key: PROJECT_Q_CAMPAIGN_XP_SETTLEMENT_ENABLED
        value: "false"
      - key: FAWKQ_WEBSITE_URL
        sync: false
      - key: XP_PER_SOL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_URL
        sync: false
      - key: TOKEN_MINT
        sync: false
      - key: ANDREW_COFOUNDER_STREAMFLOW_LOCK_ACCOUNT
        sync: false
      - key: THOMAS_COFOUNDER_STREAMFLOW_LOCK_ACCOUNT
        sync: false

  - type: cron
    name: project-q-distribute
    runtime: node
    # Cron can't express a true rolling "every 72h" (day-of-month */3 resets each
    # month). This runs every 3h; jobs/distribute.js skips the run unless 72
    # real hours have elapsed since the last completed distribution.
    schedule: "0 */3 * * *"
    buildCommand: npm install
    startCommand: npm run distribute
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_URL
        sync: false
      - key: TOKEN_MINT
        sync: false
      - key: CREATOR_WALLET_SECRET
        sync: false
      - key: COMMUNITY_WALLET_SECRET
        sync: false
      - key: COMMUNITY_WALLET_PUBLIC
        sync: false
      - key: DEV_WALLET_PUBLIC
        sync: false
      - key: OCEAN_WALLET_PUBLIC
        sync: false
      - key: BAG_WALLET_PUBLIC
        sync: false
      - key: BUYBACK_RESERVE_WALLET_PUBLIC
        sync: false
      - key: DISTRIBUTION_RESERVE_LAMPORTS
        sync: false
      - key: STAGE2_RESERVE_LAMPORTS
        sync: false

  - type: cron
    name: project-q-signal
    runtime: node
    schedule: "0 0,12 * * *"
    buildCommand: npm install
    startCommand: npm run post-signal
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
