services:
  - type: web
    name: project-q
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_USER_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        value: https://project-q-8k3a.onrender.com/webhook
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: BAGWORK_SECRET
        sync: false
      - key: ORACLE_CAMPAIGN_SECRET
        sync: false
      - key: PROJECT_Q_CAMPAIGN_APP_URL
        sync: false
      - key: PROJECT_Q_CAMPAIGN_APP_ENABLED
        value: "false"
      - key: PROJECT_Q_WALLET_VERIFICATION_ENABLED
        value: "false"
      - key: PROJECT_Q_EARN_TO_BURN_ENABLED
        value: "false"
      - key: PROJECT_Q_EARN_TO_BURN_PROGRAM_ID
        value: fawkq-earn-to-burn
      - key: PROJECT_Q_COMMUNITY_ACTIVITY_ENABLED
        value: "false"
      - key: PROJECT_Q_COMMUNITY_CHAT_ID
        sync: false
      - key: PROJECT_Q_COMMUNITY_ACTIVITY_HASH_SECRET
        sync: false
      - key: PROJECT_Q_ACTIVITY_EXCLUDED_TELEGRAM_IDS
        sync: false
      - key: FAWKQ_BOND_CAMPAIGN_POST_ID
        sync: false
      - key: FAWKQ_OFFICIAL_X_USER_ID
        sync: false
      - key: PROJECT_Q_BURN_VERIFICATION_ENABLED
        value: "false"
      - key: PROJECT_Q_BOND_SQUADS_MULTISIG
        sync: false
      - key: PROJECT_Q_BOND_SQUADS_MEMBERS
        sync: false
      - key: PROJECT_Q_BOND_ACTIVATION_VAULT_INDEX
        sync: false
      - key: PROJECT_Q_BOND_SCHEDULED_VAULT_INDEX
        sync: false
      - key: PROJECT_Q_BOND_COMMUNITY_RESERVE_VAULT_INDEX
        sync: false
      - key: PROJECT_Q_BOND_DIAMOND_DUCK_VAULT_INDEX
        sync: false
      - key: PROJECT_Q_BOND_SOL_OPERATIONS_VAULT_INDEX
        sync: false
      - key: PROJECT_Q_CAMPAIGN_READINESS_APPROVALS_ENABLED
        value: "false"
      - key: PROJECT_Q_CAMPAIGN_RULES_GOVERNANCE_ENABLED
        value: "false"
      - key: PROJECT_Q_SOURCE_CERTIFICATION_ENABLED
        value: "false"
      - key: PROJECT_Q_WEBSITE_VOTE_REVIEW_ENABLED
        value: "false"
      - key: PROJECT_Q_TRENDING_RECEIPTS_ENABLED
        value: "false"
      - key: FAWKQ_WEBSITE_URL
        sync: false
      - key: XP_PER_SOL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_URL
        sync: false
      - key: TOKEN_MINT
        sync: false
      - key: ANDREW_COFOUNDER_STREAMFLOW_LOCK_ACCOUNT
        sync: false
      - key: THOMAS_COFOUNDER_STREAMFLOW_LOCK_ACCOUNT
        sync: false

  - type: cron
    name: project-q-distribute
    runtime: node
    # Cron can't express a true rolling "every 72h" (day-of-month */3 resets each
    # month). This runs every 3h; jobs/distribute.js skips the run unless 72
    # real hours have elapsed since the last completed distribution.
    schedule: "0 */3 * * *"
    buildCommand: npm ci
    startCommand: npm run distribute
    autoDeployTrigger: checksPass
    envVars:
      - key: PROJECT_Q_DISTRIBUTIONS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_URL
        sync: false
      - key: TOKEN_MINT
        sync: false
      - key: CREATOR_WALLET_SECRET
        sync: false
      - key: CREATOR_WALLET_PUBLIC
        sync: false
      - key: COMMUNITY_WALLET_SECRET
        sync: false
      - key: COMMUNITY_WALLET_PUBLIC
        sync: false
      - key: DEV_WALLET_PUBLIC
        sync: false
      - key: OCEAN_WALLET_PUBLIC
        sync: false
      - key: BAG_WALLET_PUBLIC
        sync: false
      - key: BUYBACK_RESERVE_WALLET_PUBLIC
        sync: false
      - key: DISTRIBUTION_RESERVE_LAMPORTS
        sync: false
      - key: STAGE2_RESERVE_LAMPORTS
        sync: false

  - type: cron
    name: project-q-settle-campaign-xp
    runtime: node
    # Requires an explicit deployment flag and an ACTIVE campaign row.
    schedule: "*/10 * * * *"
    buildCommand: npm ci
    startCommand: npm run settle-campaign-xp
    autoDeployTrigger: checksPass
    envVars:
      - key: PROJECT_Q_CAMPAIGN_XP_SETTLEMENT_ENABLED
        value: "false"
      - key: PROJECT_Q_EARN_TO_BURN_ENABLED
        value: "false"
      - key: PROJECT_Q_EARN_TO_BURN_PROGRAM_ID
        value: fawkq-earn-to-burn
      - key: BOND_THE_DUCK_CAMPAIGN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: project-q-settle-community-activity
    runtime: node
    # 09:15 UTC is after midnight in Vancouver year-round; the job settles the prior local day.
    schedule: "15 9 * * *"
    buildCommand: npm ci
    startCommand: npm run settle-community-activity
    autoDeployTrigger: checksPass
    envVars:
      - key: PROJECT_Q_COMMUNITY_ACTIVITY_SETTLEMENT_ENABLED
        value: "false"
      - key: BOND_THE_DUCK_CAMPAIGN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: cron
    name: project-q-signal
    runtime: node
    schedule: "0 0,12 * * *"
    buildCommand: npm ci
    startCommand: npm run post-signal
    autoDeployTrigger: checksPass
    envVars:
      - key: PROJECT_Q_SIGNALS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_TOPIC_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
