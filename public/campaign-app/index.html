<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0e" />
  <title>Project Q Campaign Hub</title>
  <link rel="icon" type="image/webp" href="/campaign-app/assets/project-q-app-icon.webp" />
  <link rel="stylesheet" href="/campaign-app/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <aside class="rail" aria-label="Primary navigation">
      <button class="brand" data-screen="home" aria-label="Project Q home">
        <img src="/campaign-app/assets/project-q-app-icon.webp" alt="" />
      </button>
      <nav id="desktop-nav"></nav>
      <div class="rail-profile"><div class="avatar">🦆</div><span class="status-dot"></span></div>
    </aside>

    <main>
      <header class="topbar">
        <div class="topbar-identity">
          <img class="horizontal-logo" src="/campaign-app/assets/project-q-horizontal-logo.webp" alt="Project Q — Built Different. Signal Only." />
          <p class="eyebrow" id="campaign-sequence">PROJECT Q / CAMPAIGN HUB</p>
          <h1 id="screen-title">Campaign Hub</h1>
        </div>
        <div class="top-actions">
          <span class="network"><i></i> DEVNET SAFE</span>
          <button id="wallet-button" class="wallet-button">Connect wallet</button>
        </div>
      </header>

      <section id="screen" class="screen" aria-live="polite"></section>
    </main>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/campaign-app/app.js"></script>
</body>
</html>
