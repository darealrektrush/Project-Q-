name: Project Q dependency audit

on:
  push:
    branches:
      - project-q-operations-ui
    paths:
      - .github/workflows/project-q-dependency-audit.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture npm audit
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const summary = Object.entries(vulnerabilities).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : {
              source: entry.source,
              name: entry.name,
              severity: entry.severity,
              title: entry.title,
              range: entry.range,
              url: entry.url,
            }),
            effects: item.effects || [],
            range: item.range,
            fixAvailable: item.fixAvailable,
          }));
          console.log('PROJECT_Q_NPM_AUDIT_START');
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: summary }, null, 2));
          console.log('PROJECT_Q_NPM_AUDIT_END');
          NODE
